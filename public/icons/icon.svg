<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="handGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Glowing Hand Landmark Skeleton -->
  <g filter="url(#glow)" stroke="url(#handGlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Palm connections -->
    <path d="M 256,410 L 200,340 L 210,240 L 256,230 L 302,240 L 312,340 Z" />
    <!-- Wrist to Thumb -->
    <path d="M 256,410 L 170,360 L 140,300 L 130,230 L 145,170" />
    <!-- Index Finger -->
    <path d="M 210,240 L 205,170 L 205,120 L 205,80" />
    <!-- Middle Finger -->
    <path d="M 256,230 L 256,150 L 256,100 L 256,60" />
    <!-- Ring Finger -->
    <path d="M 302,240 L 307,170 L 310,125 L 312,90" />
    <!-- Pinky Finger -->
    <path d="M 312,340 L 350,290 L 360,230 L 365,175 L 368,130" />
  </g>

  <!-- Landmark Joint Nodes -->
  <g fill="#ffffff">
    <!-- Wrist Base -->
    <circle cx="256" cy="410" r="10" fill="#10b981" />
    <!-- Palm Knuckles -->
    <circle cx="200" cy="340" r="7" fill="#38bdf8" />
    <circle cx="210" cy="240" r="7" fill="#38bdf8" />
    <circle cx="256" cy="230" r="7" fill="#38bdf8" />
    <circle cx="302" cy="240" r="7" fill="#38bdf8" />
    <circle cx="312" cy="340" r="7" fill="#38bdf8" />
    
    <!-- Thumb joints -->
    <circle cx="170" cy="360" r="7" fill="#38bdf8" />
    <circle cx="140" cy="300" r="7" fill="#38bdf8" />
    <circle cx="130" cy="230" r="7" fill="#38bdf8" />
    <!-- Thumb tip -->
    <circle cx="145" cy="170" r="11" fill="url(#accent)" />

    <!-- Index joints -->
    <circle cx="205" cy="170" r="7" fill="#38bdf8" />
    <circle cx="205" cy="120" r="7" fill="#38bdf8" />
    <!-- Index tip -->
    <circle cx="205" cy="80" r="11" fill="url(#accent)" />

    <!-- Middle joints -->
    <circle cx="256" cy="150" r="7" fill="#38bdf8" />
    <circle cx="256" cy="100" r="7" fill="#38bdf8" />
    <!-- Middle tip -->
    <circle cx="256" cy="60" r="11" fill="url(#accent)" />

    <!-- Ring joints -->
    <circle cx="307" cy="170" r="7" fill="#38bdf8" />
    <circle cx="310" cy="125" r="7" fill="#38bdf8" />
    <!-- Ring tip -->
    <circle cx="312" cy="90" r="11" fill="url(#accent)" />

    <!-- Pinky joints -->
    <circle cx="350" cy="290" r="7" fill="#38bdf8" />
    <circle cx="360" cy="230" r="7" fill="#38bdf8" />
    <circle cx="365" cy="175" r="7" fill="#38bdf8" />
    <!-- Pinky tip -->
    <circle cx="368" cy="130" r="11" fill="url(#accent)" />
  </g>

  <!-- Small Camera lens badge at bottom-right corner -->
  <g transform="translate(350, 350)">
    <circle cx="45" cy="45" r="40" fill="#020617" stroke="#38bdf8" stroke-width="3" />
    <circle cx="45" cy="45" r="28" fill="#1e293b" />
    <circle cx="45" cy="45" r="16" fill="#38bdf8" />
    <circle cx="51" cy="39" r="5" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
